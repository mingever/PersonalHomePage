<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/icon" href="https://mingever.oss-cn-beijing.aliyuncs.com/index/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小满</title>
<meta name="description" content="小满的个人名片 | 愿你阅尽千帆 归来仍是少年">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    background: #0b0b0d;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    overflow: hidden;
  }

  /* 舞台：承载背景视频与内容层，作为整个首屏的定位基准 */
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: radial-gradient(120% 120% at 50% 40%, #2a2a30 0%, #111114 55%, #08080a 100%);
  }

  /* 背景层：视频与动图共用同一套定位和入场动效 */
  .bg,
  .bg-webp {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transform: scale(1.08);
    transition: opacity 1.1s ease, transform 2.8s cubic-bezier(.2, .7, .2, 1);
    will-change: opacity, transform;
  }

  /* 只保留当前选中的背景层，另一层既不渲染也不发起加载 */
  .bg:not(.is-on),
  .bg-webp:not(.is-on) {
    display: none;
  }

  .stage.is-ready .bg.is-on,
  .stage.is-ready .bg-webp.is-on {
    opacity: 1;
    transform: scale(1);
  }

  /* 首屏加载层：背景资源就绪前只露出转圈，避免看到未加载完的画面 */
  .loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0b0d;
    transition: opacity .55s ease, visibility .55s ease;
  }

  .loader.is-done {
    opacity: 0;
    visibility: hidden;
  }

  .spinner {
    width: 34px;
    height: 34px;
    border: 2px solid rgba(255, 255, 255, .15);
    border-top-color: rgba(255, 255, 255, .8);
    border-radius: 50%;
    animation: spinner-rotate .85s linear infinite;
  }

  @keyframes spinner-rotate {
    to { transform: rotate(360deg); }
  }

  /* 压暗层：保证白色文字在任何画面亮度下都可读 */
  .veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(62% 54% at 50% 50%, rgba(0, 0, 0, .58) 0%, rgba(0, 0, 0, .34) 58%, rgba(0, 0, 0, .5) 100%),
      rgba(0, 0, 0, .14);
  }

  /* 内容层 */
  .card {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    text-align: center;
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* 内容背后的柔光暗影，把文字从偏亮的画面上托出来 */
  .card::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(760px, 100%);
    height: 460px;
    transform: translate(-50%, -50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, .2) 55%, rgba(0, 0, 0, 0) 100%);
    pointer-events: none;
    z-index: -1;
  }

  .avatar-wrap {
    animation: rise .95s cubic-bezier(.16, 1, .3, 1) .35s both;
  }

  .avatar {
    display: block;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid rgba(255, 255, 255, .5);
    box-shadow:
      0 0 0 7px rgba(255, 255, 255, .08),
      0 22px 55px rgba(0, 0, 0, .55);
    cursor: pointer;
    transition: transform .85s cubic-bezier(.16, 1, .3, 1), box-shadow .5s ease;
  }

  .name {
    margin: 30px 0 0;
    font-size: 48px;
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: .2em;
    text-indent: .2em;
    text-shadow: 0 2px 20px rgba(0, 0, 0, .8), 0 1px 3px rgba(0, 0, 0, .55);
    animation: rise .95s cubic-bezier(.16, 1, .3, 1) .58s both;
  }

  .motto {
    margin: 22px 0 0;
    max-width: 92vw;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.95;
    letter-spacing: .14em;
    text-indent: .14em;
    color: rgba(255, 255, 255, .9);
    text-shadow: 0 2px 16px rgba(0, 0, 0, .85), 0 1px 2px rgba(0, 0, 0, .6);
    animation: rise .95s cubic-bezier(.16, 1, .3, 1) .8s both;
  }

  .motto span { white-space: nowrap; }

  /* 桌面端用全角空格把两段连成一行 */
  .motto span + span::before { content: "\3000"; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 背景就绪前暂停入场动画，避免加载期间动画提前跑完 */
  .avatar-wrap,
  .name,
  .motto {
    animation-play-state: paused;
  }

  .stage.is-ready .avatar-wrap,
  .stage.is-ready .name,
  .stage.is-ready .motto {
    animation-play-state: running;
  }

  /* 仅在存在真实指针设备时启用悬停光晕，避免触屏误触发 */
  @media (hover: hover) and (pointer: fine) {
    .avatar:hover {
      box-shadow:
        0 0 0 11px rgba(255, 255, 255, .1),
        0 26px 60px rgba(0, 0, 0, .55);
    }
  }

  @media screen and (max-width: 560px) {
    .avatar { width: 104px; height: 104px; }
    .name {
      margin-top: 24px;
      font-size: 36px;
      letter-spacing: .16em;
      text-indent: .16em;
    }
    .motto {
      margin-top: 16px;
      font-size: 14px;
      line-height: 2.05;
      letter-spacing: .1em;
      text-indent: .1em;
    }
    /* 窄屏拆成两行，避免整句挤到边上 */
    .motto span { display: block; }
    .motto span + span::before { content: none; }
  }

  /* 尊重系统的“减少动态效果”设置 */
  @media (prefers-reduced-motion: reduce) {
    .bg, .bg-webp { transition: none; opacity: 1; transform: none; }
    .avatar-wrap, .name, .motto { animation: none; }
    .avatar { transition: none; }
  }
</style>
</head>

<body>
  <div class="loader" id="loader" aria-hidden="true">
    <span class="spinner"></span>
  </div>

  <div class="stage" id="stage">
    <!-- 微信内置浏览器会拦截视频自动播放，这一层专门给它用动图 -->
    <img class="bg-webp" id="bgWebp" alt="" aria-hidden="true">

    <video class="bg" id="bgVideo"
           autoplay muted loop playsinline webkit-playsinline x5-playsinline
           preload="none" disablepictureinpicture aria-hidden="true"></video>
    <div class="veil" aria-hidden="true"></div>

    <main class="card">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar"
             src="https://mingever.oss-cn-beijing.aliyuncs.com/index/avatar.jpg"
             alt="小满" draggable="false">
      </div>
      <h1 class="name">小满</h1>
      <p class="motto"><span>愿你阅尽千帆</span><span>归来仍是少年</span></p>
    </main>
  </div>

  <script>
    (function () {
      var stage = document.getElementById('stage');
      var video = document.getElementById('bgVideo');
      var webp  = document.getElementById('bgWebp');
      var loader = document.getElementById('loader');
      var avatar = document.getElementById('avatar');

      var VIDEO_URL = 'https://mingever.oss-cn-beijing.aliyuncs.com/index/main.mp4';
      var WEBP_URL  = 'https://mingever.oss-cn-beijing.aliyuncs.com/index/main.webp';

      var revealed = false;
      function reveal() {
        if (revealed) return;
        revealed = true;
        // 背景就绪后同时收起转圈、放出内容入场动画
        loader.classList.add('is-done');
        stage.classList.add('is-ready');
      }

      // 切到动图：微信这类容器会拦截视频自动播放，用动图绕过该限制
      var usingWebp = false;
      function useWebp() {
        if (usingWebp) return;
        usingWebp = true;
        // 视频若已开始下载则取消，避免继续占用流量
        video.removeAttribute('src');
        try { video.load(); } catch (e) {}
        video.classList.remove('is-on');

        webp.addEventListener('load', reveal, { once: true });
        webp.addEventListener('error', reveal, { once: true });
        webp.src = WEBP_URL;
        webp.classList.add('is-on');
        void webp.offsetWidth;   // 强制回流，保证淡入过渡正常触发
      }

      // 切到视频：先尝试播放，能播就用视频，画质最好
      function useVideo() {
        video.addEventListener('error', useWebp, { once: true });
        video.src = VIDEO_URL;
        video.classList.add('is-on');
        void video.offsetWidth;

        var played = video.play ? video.play() : null;
        if (played && played.then) {
          // 真正开始播放后才结束加载态；被容器拦截时回落到动图
          played.then(reveal).catch(useWebp);
        } else {
          video.addEventListener('canplay', reveal, { once: true });
        }
      }

      // 不按浏览器类型判断：统一先试视频，播不了再回落动图
      useVideo();

      // 兜底：长时间未就绪时也结束加载态，避免一直停在转圈
      setTimeout(reveal, 10000);

      // 点击头像旋转一圈
      var spinning = false;
      avatar.addEventListener('click', function () {
        if (spinning) return;
        spinning = true;
        avatar.style.transition = 'transform .8s cubic-bezier(.16, 1, .3, 1)';
        avatar.style.transform = 'rotate(360deg)';
        setTimeout(function () {
          avatar.style.transition = '';
          avatar.style.transform = '';
          spinning = false;
        }, 820);
      });
    })();
  </script>
</body>
</html>
